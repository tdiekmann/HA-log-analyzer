name: HA Log Analyzer
version: "0.1.4"
slug: ha_log_analyzer
description: >-
  Analyze your Home Assistant logs with AI. All secrets are redacted locally
  before being sent to any external service. Supports OpenRouter and any
  OpenAI-compatible API endpoint.
url: https://github.com/tdiekmann/HA-log-analyzer
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

ingress: true
ingress_port: 8099
homeassistant_api: true
hassio_api: true
hassio_role: manager

panel_icon: mdi:magnify-scan
panel_title: Log Analyzer

options:
  api_key: ""
  model: "anthropic/claude-haiku-4-5"
  base_url: "https://openrouter.ai/api/v1"
  default_lines: 500
  default_levels:
    - WARNING
    - ERROR
    - CRITICAL
  redaction_style: "typed"

schema:
  api_key: str
  model: str
  base_url: str
  default_lines: int(10,20000)
  default_levels:
    - str
  redaction_style: list(typed|fixed)
